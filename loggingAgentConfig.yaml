logging:
  receivers:
    webapp_log:
      type: files
      include_paths:
        - /var/log/webapp.log
      record_log_file_path: true
  processors:
    webapp_processor:
      type: parse_json
      time_key: time
      #time_format: "%Y-%m-%dT%H:%M:%S.%L%Z"
      time_format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
    move_severity:
       type: modify_fields
       fields:
          severity:
            move_from: jsonPayload.level
  service:
    pipelines:
      webapp_pipeline:
        receivers: [webapp_log]
        processors: [webapp_processor, move_severity]