logging:
  receivers:
    webapp_log:
      type: files
      include_paths:
        - /var/log/webapp.log
      record_log_file_path: true
  processors:
    webapp_processor:
      type: parse_json
      time_key: time
      time_format: "%Y-%m-%dT%H:%M:%S.%L%Z"
    move_severity:
       type: modify_fields
       fields:
          severity:
            move_from: JsonPayload.level
  service:
    pipelines:
      webapp_pipeline:
        receivers: [webapp-log]
        processors: [webapp-processor, move_severity]